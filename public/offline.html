<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#161826">
    <title>Hors ligne — Pointage</title>
    <style>
        :root { color-scheme: dark; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 28px;
            background: #161826;
            color: #e9e9ed;
            font-family: Inter, system-ui, sans-serif;
            text-align: center;
        }

        .ring {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            border: 1px solid #9184d9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9184d9;
            font-size: 26px;
        }

        h1 {
            margin: 16px 0 0;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: -0.015em;
        }

        p {
            margin: 6px 0 0;
            font-size: 13px;
            color: rgba(233, 233, 237, 0.55);
            line-height: 1.5;
        }

        button {
            margin-top: 24px;
            padding: 11px 22px;
            background: transparent;
            border: 1px solid #9184d9;
            border-radius: 8px;
            color: #d2cefd;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        button:hover { background: rgba(145, 132, 217, 0.12); }
    </style>
</head>
<body>
    <main>
        <div class="ring" aria-hidden="true">&#9679;</div>
        <h1>Hors ligne</h1>
        <p>
            Vos soldes ne sont pas conservés sur l'appareil : ils demandent une connexion.<br>
            Reconnectez-vous au réseau pour retrouver vos comptes.
        </p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
