# Pile de production alimentée par une image déjà construite, récupérée depuis le
# registre. Le serveur ne compile rien : il économise le pic de mémoire du build et
# la bascule ne prend que quelques secondes.
#
# Le registre (compose.registry.yaml) tourne sur cette même machine, en boucle
# locale : "localhost:5000" désigne donc ici le registre du VPS, pas celui de la CI.
#
# L'application ne détient pas les ports 80/443 : c'est le Traefik du serveur
# (compose.proxy.yaml) qui termine le TLS et la joint par le réseau « proxy ».
# Elle sert donc du HTTP simple (SERVER_NAME=:80) et fait confiance aux en-têtes
# X-Forwarded-* de ce seul réseau — TRUSTED_PROXIES dans le .env.
#
# La CI passe l'empreinte exacte à déployer :
#   POINTAGE_IMAGE=localhost:5000/pointage:<sha> \
#     docker compose -f compose.deploy.yaml up -d

# Nom de projet figé : les volumes ne dépendent pas du nom du dossier, qui pourrait
# être renommé sans qu'on veuille perdre la base.
name: pointage

services:
    app:
        image: '${POINTAGE_IMAGE:-localhost:5000/pointage:latest}'
        restart: unless-stopped
        env_file: .env
        environment:
            # HTTP simple : le TLS est l'affaire du proxy.
            SERVER_NAME: ':80'
            MIGRATE_ON_BOOT: 'true'
        labels:
            traefik.enable: 'true'
            traefik.http.routers.pointage.rule: 'Host(`${APP_DOMAIN}`)'
            traefik.http.routers.pointage.entrypoints: 'websecure'
            traefik.http.routers.pointage.tls.certresolver: 'le'
            traefik.http.services.pointage.loadbalancer.server.port: '80'
        volumes:
            - storage:/app/storage
        networks:
            - default
            - proxy
        depends_on:
            mysql:
                condition: service_healthy

    scheduler:
        image: '${POINTAGE_IMAGE:-localhost:5000/pointage:latest}'
        restart: unless-stopped
        env_file: .env
        entrypoint: ['php', 'artisan', 'schedule:work']
        healthcheck:
            # Celui de l'image sonde Caddy, qui ne tourne pas ici : le
            # planificateur n'est qu'une boucle artisan.
            disable: true
        volumes:
            - storage:/app/storage
        depends_on:
            app:
                condition: service_started
            mysql:
                condition: service_healthy

    # Boîte aux lettres de l'instance : l'application lui remet ses e-mails
    # (signalements de bug) en SMTP interne, et on les lit dans son interface
    # web. Deux accès : le tunnel SSH (toujours disponible) —
    #   ssh -L 8025:127.0.0.1:8025 VOTRE_HOTE  puis  http://localhost:8025
    # — ou le sous-domaine MAILPIT_DOMAIN via Traefik, en HTTPS et protégé par
    # le mot de passe haché de MAILPIT_BASIC_AUTH (voir .env.production.example).
    mailpit:
        image: axllent/mailpit
        restart: unless-stopped
        environment:
            # Sans base, les messages disparaissent à chaque redéploiement.
            MP_DATABASE: /data/mailpit.db
        labels:
            traefik.enable: 'true'
            traefik.http.routers.mailpit.rule: 'Host(`${MAILPIT_DOMAIN:-mailpit.localhost}`)'
            traefik.http.routers.mailpit.entrypoints: 'websecure'
            traefik.http.routers.mailpit.tls.certresolver: 'le'
            traefik.http.routers.mailpit.middlewares: 'mailpit-auth'
            traefik.http.middlewares.mailpit-auth.basicauth.users: '${MAILPIT_BASIC_AUTH:-}'
            traefik.http.services.mailpit.loadbalancer.server.port: '8025'
        ports:
            - '127.0.0.1:8025:8025'
        networks:
            - default
            - proxy
        volumes:
            - mailpit-data:/data

    # Temps réel des comptes partagés : Soketi parle le protocole Pusher sans
    # rien envoyer chez pusher.com. Le navigateur le joint en wss sur le même
    # domaine que l'application — le protocole vit sous /app/…, Traefik y
    # aiguille — pas de nouveau sous-domaine à déclarer. L'application, elle,
    # le joint en interne (PUSHER_HOST=soketi).
    soketi:
        image: 'quay.io/soketi/soketi:1.6-16-alpine'
        restart: unless-stopped
        environment:
            SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
            SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
            SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
            # Métriques Prometheus sur le port 9601 — jamais publié ni routé par
            # Traefik : seul le Prometheus du monitoring vient les lire, par le
            # réseau « proxy » qu'ils partagent déjà.
            SOKETI_METRICS_ENABLED: '1'
        labels:
            traefik.enable: 'true'
            traefik.http.routers.soketi.rule: 'Host(`${APP_DOMAIN}`) && PathPrefix(`/app/`)'
            traefik.http.routers.soketi.entrypoints: 'websecure'
            traefik.http.routers.soketi.tls.certresolver: 'le'
            traefik.http.services.soketi.loadbalancer.server.port: '6001'
        networks:
            - default
            - proxy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
        command:
            - '--innodb-buffer-pool-size=128M'
            - '--performance-schema=OFF'
            - '--innodb-flush-method=O_DIRECT'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-p${DB_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 40s

networks:
    # Créé une fois pour toutes avec le proxy — voir compose.proxy.yaml.
    proxy:
        external: true

volumes:
    mysql-data:
    storage:
    mailpit-data:
