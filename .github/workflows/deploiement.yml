# Déploiement continu vers le VPS.
#
# Trois temps : la suite de tests, la construction et la publication de l'image,
# puis la bascule sur le serveur. Rien n'est déployé si les tests échouent, et le
# serveur ne compile rien — il récupère une image déjà prête.
#
# Secrets à créer (Settings → Secrets and variables → Actions) :
#   VPS_HOST         adresse ou nom d'hôte du serveur
#   VPS_USER         utilisateur de déploiement, membre du groupe docker
#   VPS_SSH_KEY      clé privée dédiée au déploiement, en entier
#   VPS_KNOWN_HOSTS  sortie de « ssh-keyscan VOTRE_HOTE », pour ne pas
#                    faire confiance aveuglément au serveur qui répond
#   APP_HEALTH_URL   par exemple https://pointage.exemple.duckdns.org

name: Déploiement

on:
    push:
        branches: [main]
    workflow_dispatch:

# Deux déploiements simultanés se marcheraient sur les pieds.
concurrency:
    group: deploiement
    cancel-in-progress: false

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_DATABASE: testing
                    MYSQL_ROOT_PASSWORD: racine
                ports: ['3306:3306']
                options: >-
                    --health-cmd="mysqladmin ping -pracine"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=12
        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: testing
            DB_USERNAME: root
            DB_PASSWORD: racine
        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: pdo_mysql, intl
                  coverage: none

            - name: Installer les dépendances
              run: composer install --prefer-dist --no-interaction --no-progress

            - name: Préparer l'environnement de test
              run: cp .env.example .env && php artisan key:generate

            - name: Lancer la suite
              run: php artisan test

            - name: Vérifier le style
              run: vendor/bin/pint --test

    image:
        name: Image
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            reference: ${{ steps.reference.outputs.value }}
        steps:
            - uses: actions/checkout@v4

            - name: Calculer la référence de l'image
              id: reference
              # Déployer une empreinte précise plutôt que « latest » : on sait
              # exactement ce qui tourne, et la bascule est reproductible.
              run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ steps.reference.outputs.value }}
                      ghcr.io/${{ github.repository }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploiement:
        name: Bascule sur le serveur
        needs: image
        runs-on: ubuntu-latest
        steps:
            - name: Préparer l'accès SSH
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploiement
                  chmod 600 ~/.ssh/deploiement
                  printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts

            - name: Déployer
              env:
                  IMAGE: ${{ needs.image.outputs.reference }}
              run: |
                  ssh -i ~/.ssh/deploiement "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
                    "set -e
                     cd /srv/pointage
                     git pull --ff-only
                     export POINTAGE_IMAGE='$IMAGE'
                     docker compose -f compose.deploy.yaml pull
                     docker compose -f compose.deploy.yaml up -d --remove-orphans
                     docker image prune -f"

            - name: Vérifier que l'application répond
              # Le conteneur applique les migrations et reconstruit ses caches avant
              # d'écouter : on laisse le temps à la bascule.
              run: |
                  curl --fail --show-error --silent \
                    --retry 12 --retry-delay 5 --retry-all-errors \
                    --max-time 30 \
                    "${{ secrets.APP_HEALTH_URL }}/up" > /dev/null
                  echo "L'application répond."
