; Le code ne change pas dans une image construite : opcache peut travailler à
; plein régime et cesser de vérifier les dates de modification des fichiers.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=12
opcache.max_accelerated_files=20000

; Marge confortable pour l'envoi d'un relevé ou d'une saisie longue.
upload_max_filesize=8M
post_max_size=8M
memory_limit=256M
expose_php=Off
